# =============================================
# Banco de dados H2 configurado para imitar Postgres
# =============================================
spring.test.database.replace=none
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# =============================================
# JPA / Hibernate para Testes
# =============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# =============================================
# Desliga o Flyway nos testes (evita conflitos com H2)
# =============================================
spring.flyway.enabled=false

# =============================================
# Variáveis de Ambiente Mockadas para os testes
# =============================================
api.security.token.secret=segredo-para-testes